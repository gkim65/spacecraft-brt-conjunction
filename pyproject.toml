[project]
name = "spacecraft-brt-conjunction"
version = "0.1.0"
description = "Reachability-based collision avoidance and probabilistic conjunction assessment for spacecraft-debris encounters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "brahe>=0.8",
    "jax[cpu]>=0.4",
    "cvxpy>=1.4",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecraft_brt"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
